<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Game Hub</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#07111eea,#111827f2);z-index:10}
.panel{width:min(92vw,430px);padding:24px;text-align:center;border-radius:24px;background:#182235;border:1px solid #ffffff25}
h1{margin:0 0 8px;font-size:34px}p{color:#b8c4d8}
button{width:100%;margin:8px 0;padding:15px;border:0;border-radius:14px;font-size:19px;font-weight:700;background:#2f80ed;color:white}
#hud{position:fixed;top:12px;left:12px;right:12px;display:none;justify-content:space-between;z-index:5;font-weight:700;font-size:18px;text-shadow:0 2px 3px #000}
#back{display:none;position:fixed;right:12px;top:10px;z-index:6;width:auto;padding:10px 15px;background:#222b3b}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:8;background:#0008}
#msg div{background:#182235;padding:25px;border-radius:20px;text-align:center;width:min(85vw,350px)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="menu"><div class="panel">
<h1>🎮 GAME HUB</h1><p>તમારી પોતાની 3 ગેમ</p>
<button data-game="runner">🏃 3D Runner</button>
<button data-game="coins">🪙 Coin Collector</button>
<button data-game="car">🚗 Car Dodge</button>
</div></div>
<div id="hud"><span id="score">સ્કોર: 0</span><span id="lives">❤️❤️❤️</span></div>
<button id="back">☰ Menu</button>
<div id="msg"><div><h2 id="msgTitle"></h2><p id="msgText"></p><button id="retry">ફરી રમો</button><button id="menuBtn">મેનુ</button></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,game='',run=false,last=0,score=0,lane=1,objs=[],lives=3,keys={};
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
const menu=document.getElementById('menu'),hud=document.getElementById('hud'),back=document.getElementById('back'),msg=document.getElementById('msg');
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>start(b.dataset.game));
back.onclick=showMenu;document.getElementById('menuBtn').onclick=showMenu;document.getElementById('retry').onclick=()=>start(game);
function showMenu(){run=false;menu.style.display='flex';hud.style.display='none';back.style.display='none';msg.style.display='none'}
function start(g){game=g;run=true;menu.style.display='none';hud.style.display='flex';back.style.display='block';msg.style.display='none';score=0;lane=1;lives=3;objs=[];last=performance.now();requestAnimationFrame(loop)}
function over(){run=false;document.getElementById('msgTitle').textContent='🎮 Game Over';document.getElementById('msgText').textContent='તમારો સ્કોર: '+Math.floor(score);msg.style.display='flex'}
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key==='ArrowLeft')lane=Math.max(0,lane-1);if(e.key==='ArrowRight')lane=Math.min(2,lane+1);if(e.key===' '&&game==='runner')keys.jump=1});
addEventListener('keyup',e=>keys[e.key]=0);
let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)){if(dx>30)lane=Math.min(2,lane+1);if(dx<-30)lane=Math.max(0,lane-1)}else if(dy<-30&&game==='runner')keys.jump=1},{passive:true});
function road(){x.fillStyle='#62a55b';x.fillRect(0,0,W,H);x.fillStyle='#3b3b3b';x.fillRect(W*.15,0,W*.7,H);x.strokeStyle='#ddd';x.setLineDash([30,30]);x.lineWidth=4;for(let i=1;i<3;i++){x.beginPath();x.moveTo(W*(.15+i*.233),0);x.lineTo(W*(.15+i*.233),H);x.stroke()}x.setLineDash([])}
function loop(t){if(!run)return;let dt=Math.min(.035,(t-last)/1000);last=t;score+=dt*10;document.getElementById('score').textContent='સ્કોર: '+Math.floor(score);document.getElementById('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);road();
if(game==='runner')runner(dt);if(game==='coins')collector(dt);if(game==='car')car(dt);requestAnimationFrame(loop)}
function px(l){return W*(.15+(l+.5)*.233)}
let py=0,pvy=0,spawn=0;
function runner(dt){spawn-=dt;if(spawn<=0){objs.push({l:Math.floor(Math.random()*3),y:-60,type:'bad'});if(Math.random()<.7)objs.push({l:Math.floor(Math.random()*3),y:-180,type:'coin'});spawn=.75}
pvy-=900*dt;py+=pvy*dt;if(py<0){py=0;pvy=0}if(keys.jump&&py===0){pvy=650;keys.jump=0}
objs.forEach(o=>o.y+=300*dt);drawPlayer(px(lane),H-130-py);for(let i=objs.length-1;i>=0;i--){let o=objs[i];if(o.type==='coin'){drawCoin(px(o.l),o.y);if(o.l===lane&&Math.abs(o.y-(H-150-py))<45){score+=20;objs.splice(i,1)}}else{drawBlock(px(o.l),o.y);if(o.l===lane&&Math.abs(o.y-(H-130-py))<55&&py<45){lives--;objs.splice(i,1);if(lives<=0)over()}}if(o.y>H+80)objs.splice(i,1)}}
function collector(dt){spawn-=dt;if(spawn<=0){objs.push({l:Math.floor(Math.random()*3),y:-40,type:'coin'});spawn=.45}objs.forEach(o=>o.y+=250*dt);drawPlayer(px(lane),H-120);for(let i=objs.length-1;i>=0;i--){let o=objs[i];drawCoin(px(o.l),o.y);if(o.l===lane&&Math.abs(o.y-(H-130))<50){score+=30;objs.splice(i,1)}else if(o.y>H+30)objs.splice(i,1)}}
function car(dt){spawn-=dt;if(spawn<=0){objs.push({l:Math.floor(Math.random()*3),y:-70,type:'car'});spawn=Math.max(.35,.8-score/1000)}objs.forEach(o=>o.y+=330*dt);drawCar(px(lane),H-130);for(let i=objs.length-1;i>=0;i--){let o=objs[i];drawEnemyCar(px(o.l),o.y);if(o.l===lane&&Math.abs(o.y-(H-130))<70){lives--;objs.splice(i,1);if(lives<=0)over()}if(o.y>H+90)objs.splice(i,1)}}
function drawPlayer(a,b){x.fillStyle='#e53935';x.fillRect(a-23,b-35,46,60);x.fillStyle='#ffd2b0';x.beginPath();x.arc(a,b-55,20,0,7);x.fill();x.fillStyle='#222';x.fillRect(a-22,b-78,44,12)}
function drawCar(a,b){x.fillStyle='#1687ff';x.fillRect(a-30,b-55,60,85);x.fillStyle='#bde7ff';x.fillRect(a-22,b-42,44,25);x.fillStyle='#111';x.fillRect(a-35,b+18,18,18);x.fillRect(a+17,b+18,18,18)}
function drawEnemyCar(a,b){x.fillStyle='#ff3b30';x.fillRect(a-30,b-55,60,85);x.fillStyle='#ffd6d6';x.fillRect(a-22,b-42,44,25);x.fillStyle='#111';x.fillRect(a-35,b+18,18,18);x.fillRect(a+17,b+18,18,18)}
function drawBlock(a,b){x.fillStyle='#ff7043';x.fillRect(a-30,b-30,60,60);x.fillStyle='#fff';x.fillRect(a-22,b-20,44,10)}
function drawCoin(a,b){x.fillStyle='#ffd21f';x.beginPath();x.arc(a,b,18,0,7);x.fill();x.fillStyle='#fff3a0';x.font='bold 20px Arial';x.textAlign='center';x.fillText('★',a,b+7)}
</script></body></html>
